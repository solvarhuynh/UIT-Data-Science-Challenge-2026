repos:
  # Use the project .venv instead of isolated Poetry hook builds. The latter
  # can fail to decode non-ASCII Windows user paths.
  - repo: local
    hooks:
      - id: project-quality
        name: project quality gate
        entry: python scripts/quality_gate.py
        language: system
        pass_filenames: false

  # General code quality
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-added-large-files
        args: [--maxkb=1000]
      - id: check-json
      - id: check-merge-conflict
      - id: debug-statements
      - id: check-docstring-first
