[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "udsc2026"
version = "0.1.0"
requires-python = ">=3.10,<3.13"
dependencies = [
    "fastapi>=0.112,<1.0",
    "pydantic>=2.8",
    "pyyaml>=6.0",
    "uvicorn>=0.30,<1.0",
]

[project.optional-dependencies]
llm = [
    "accelerate>=0.33,<2.0",
    "torch>=2.2,<3.0",
    "transformers>=5.0,<6.0",
]
rerank = [
    "sentence-transformers>=5.4.1,<6.0",
]
retrieval = [
    "faiss-cpu>=1.8,<2.0",
    "numpy>=1.26,<2.0",
    "pyvi>=0.1,<1.0",
    "qdrant-client>=1.10,<2.0",
    "rank-bm25>=0.2,<1.0",
    "sentence-transformers>=5.4.1,<6.0",
]

[tool.setuptools.package-data]
"udsc2026.ingestion.legal_structure" = ["abbreviations.json"]

[tool.ruff]
line-length = 88
target-version = "py310"
src = ["src", "tests", "scripts", "experiments"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "E501", "F", "I"]

[tool.ruff.lint.isort]
known-first-party = ["udsc2026"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.black]
line-length = 88
target-version = ['py310', 'py311', 'py312']
include = '\.pyi?$'
extend-exclude = '''
/(
  # directories
  \.eggs
  | \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | _build
  | buck-out
  | build
  | dist
  | migrations
)/
'''

[tool.isort]
profile = "black"
multi_line_output = 3
line_length = 88
include_trailing_comma = true
force_grid_wrap = 0
use_parentheses = true
ensure_newline_before_comments = true
src_paths = ["src", "frontend", "tests"]
skip_glob = ["*/migrations/*", "*/__pycache__/*"]

[tool.mypy]
python_version = "3.10"
cache_dir = ".cache/mypy"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_untyped_decorators = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
warn_unreachable = true
strict_equality = true
show_error_codes = true

[[tool.mypy.overrides]]
module = ["tests.*", "migrations.*"]
ignore_errors = true

[[tool.mypy.overrides]]
module = [
    "cohere.*",
    "faiss.*",
    "llama_index.*",
    "pdfplumber.*",
    "pyvi.*",
    "qdrant_client.*",
    "rank_bm25.*",
    "sentence_transformers.*",
    "tavily.*",
    "transformers.*",
    "vllm.*",
]
ignore_missing_imports = true

[tool.bandit]
exclude_dirs = ["tests", "migrations", "__pycache__"]
skips = ["B101", "B601"]

[tool.pydocstyle]
convention = "google"
"add-ignore" = [
    "D202",
    "D203",
    "D213",
    "D301",
]
match-dir = "(?!tests)(?!migrations).*"
