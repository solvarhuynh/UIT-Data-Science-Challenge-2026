<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="360" viewBox="0 0 1280 360" role="img" aria-labelledby="bannerTitle bannerDesc">
<title id="bannerTitle">UIT Data Science Challenge 2026 · HCMUTE-SHIPCODE</title>
<desc id="bannerDesc">Competition submission banner for HCMUTE-SHIPCODE: Vietnamese Legal RAG Platform — LegalIR and LegalQA. Vector artwork depicts legal document retrieval, analytics and AI pipeline.</desc>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#071326"/><stop offset=".58" stop-color="#0A2443"/><stop offset="1" stop-color="#073451"/>
  </linearGradient>
  <radialGradient id="ambient" cx="78%" cy="52%" r="64%">
    <stop stop-color="#0D658B" stop-opacity=".56"/><stop offset=".54" stop-color="#103A64" stop-opacity=".17"/><stop offset="1" stop-color="#06172B" stop-opacity="0"/>
  </radialGradient>
  <linearGradient id="teal" x1="0" y1="0" x2="1" y2="1">
    <stop stop-color="#62F4D2"/><stop offset=".5" stop-color="#3CCDEE"/><stop offset="1" stop-color="#368DFF"/>
  </linearGradient>
  <linearGradient id="tealLine" x1="0" y1="0" x2="1" y2="0">
    <stop stop-color="#39DBF4" stop-opacity="0"/><stop offset=".55" stop-color="#39DBF4" stop-opacity=".58"/><stop offset="1" stop-color="#3AE8C6" stop-opacity=".9"/>
  </linearGradient>
  <linearGradient id="panel" x1="0" y1="0" x2="1" y2="1">
    <stop stop-color="#102B45"/><stop offset=".63" stop-color="#0B223B"/><stop offset="1" stop-color="#061B30"/>
  </linearGradient>
  <linearGradient id="tile" x1="0" y1="0" x2="0" y2="1">
    <stop stop-color="#143D5A"/><stop offset="1" stop-color="#0B2D4B"/>
  </linearGradient>
  <linearGradient id="wave" x1="0" y1="0" x2="1" y2="0">
    <stop stop-color="#1176DD" stop-opacity=".25"/><stop offset=".5" stop-color="#186FCB" stop-opacity=".18"/><stop offset="1" stop-color="#13D1CD" stop-opacity=".35"/>
  </linearGradient>
  <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
    <path d="M32 0H0V32" fill="none" stroke="#6CD6F0" stroke-opacity=".055" stroke-width=".7"/>
  </pattern>
  <pattern id="dots" width="13" height="13" patternUnits="userSpaceOnUse">
    <circle cx="2" cy="2" r="1" fill="#3ED3E7" opacity=".24"/>
  </pattern>
  <filter id="blur" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="24"/></filter>
  <filter id="neon" x="-70%" y="-70%" width="240%" height="240%"><feGaussianBlur stdDeviation="4.5"/></filter>
  <clipPath id="frame"><rect width="1280" height="360" rx="18"/></clipPath>
  <clipPath id="plot"><rect x="1080" y="128" width="122" height="55" rx="4"/></clipPath>
</defs>
<g clip-path="url(#frame)">
  <rect width="1280" height="360" fill="url(#bg)"/>
  <rect width="1280" height="360" fill="url(#ambient)"/>
  <rect width="1280" height="360" fill="url(#grid)"/>
  <ellipse cx="1120" cy="216" rx="305" ry="180" fill="#20B8CC" opacity=".10" filter="url(#blur)"/>
  <ellipse cx="448" cy="397" rx="390" ry="136" fill="#1469CA" opacity=".16" filter="url(#blur)"/>
  <!-- flowing blue and cyan fabric-like waves -->
  <path d="M-30 289C165 259 269 353 451 324S777 260 962 314S1152 351 1310 284V400H-30Z" fill="url(#wave)" opacity=".48"/>
  <path d="M-25 305C154 261 279 367 463 325S737 265 947 320S1149 350 1301 299" stroke="#198FE1" stroke-opacity=".45" fill="none" stroke-width="1.4"/>
  <path d="M-10 349C235 312 343 385 566 343S895 346 1042 327S1220 316 1310 320" stroke="url(#tealLine)" stroke-opacity=".56" fill="none" stroke-width="1.4"/>
  <path d="M410 335Q762 260 1120 360H410Z" fill="url(#dots)" opacity=".48"/>
  <!-- subtle layout motif -->
  <path d="M715 -30L890 390M755 -30L930 390" stroke="#2E7DA0" stroke-opacity=".045" stroke-width="50"/>
  <!-- status eyebrow, deliberately competition not project -->
  <g font-family="Inter,'Segoe UI',Arial,sans-serif">
    <rect x="55" y="46" width="286" height="30" rx="15" fill="#123D53" fill-opacity=".76" stroke="#2EBCCB" stroke-opacity=".54"/>
    <circle cx="72" cy="61" r="4" fill="#5BF1D3"/>
    <text x="85" y="65.5" font-size="11.5" font-weight="700" letter-spacing="1.7" fill="#ACF4ED">COMPETITION SUBMISSION</text>
    <!-- strong text hierarchy -->
    <rect x="55" y="120" width="5" height="92" rx="2.5" fill="url(#teal)"/>
    <text x="77" y="149" font-size="36" font-weight="800" letter-spacing="-.75" fill="#F5FAFF">UIT DATA SCIENCE CHALLENGE 2026</text>
    <text x="75" y="206" font-size="48" font-weight="800" letter-spacing="-1.5" fill="#F5FAFF">HCMUTE<tspan fill="#5CE6DC">-</tspan>SHIPCODE</text>
    <path d="M77 226H693" stroke="#3D91A9" stroke-opacity=".4" stroke-width="1"/>
    <text x="77" y="259" font-size="19.5" font-weight="600" fill="#58DDF0" letter-spacing="-.4">Vietnamese Legal RAG Platform</text>
    <text x="77" y="283" font-size="15" font-weight="500" fill="#B7D7E8" letter-spacing=".15">LegalIR  <tspan fill="#5AC5D4">&amp;</tspan>  LegalQA</text>
  </g>
  <!-- right panel: retrieval/analytics contest solution -->
  <g>
    <rect x="796" y="38" width="440" height="277" rx="17" fill="#03182E" opacity=".4"/>
    <rect x="794" y="36" width="440" height="277" rx="17" fill="url(#panel)" stroke="#448DAC" stroke-opacity=".65" stroke-width="1.4"/>
    <path d="M795 76H1233" stroke="#5194A9" stroke-opacity=".38"/>
    <circle cx="814" cy="57" r="3.2" fill="#F27B86"/><circle cx="827" cy="57" r="3.2" fill="#EDC05E"/><circle cx="840" cy="57" r="3.2" fill="#5BDFBB"/>
    <text x="859" y="61" font-family="Inter,'Segoe UI',Arial,sans-serif" font-size="11.5" font-weight="700" fill="#C4DDEB" letter-spacing="1.4">LEGAL AI / RETRIEVAL OVERVIEW</text>
    <!-- Legal document panel -->
    <rect x="811" y="93" width="150" height="200" rx="12" fill="url(#tile)" stroke="#387FA0" stroke-opacity=".56"/>
    <!-- soft halo behind document -->
    <circle cx="887" cy="179" r="55" fill="#12C6DF" opacity=".08" filter="url(#blur)"/>
    <g fill="none" stroke-linejoin="round" stroke-linecap="round">
      <path d="M850 123H897L917 143V249Q917 256 909 256H850Q842 256 842 248V131Q842 123 850 123Z" stroke="#59D9EB" stroke-width="2.3"/>
      <path d="M896 124V143H916" stroke="#59D9EB" stroke-width="2"/>
      <path d="M880 157V205M856 170L880 161L904 170M860 208H900" stroke="#A0F4F5" stroke-width="2.3"/>
      <path d="M856 170L846 190M856 170L866 190M904 170L894 190M904 170L914 190" stroke="#A0F4F5" stroke-width="1.4"/>
      <path d="M841 191Q847 203 856 203Q865 203 871 191Z" fill="#4BC1DB" fill-opacity=".25" stroke="#A0F4F5" stroke-width="1.4"/>
      <path d="M889 191Q895 203 904 203Q913 203 919 191Z" fill="#4BC1DB" fill-opacity=".25" stroke="#A0F4F5" stroke-width="1.4"/>
      <path d="M858 224H900M858 234H893" stroke="#36C4D5" stroke-opacity=".75" stroke-width="3"/>
    </g>
    <!-- Retrieval results chart -->
    <rect x="974" y="93" width="243" height="114" rx="12" fill="url(#tile)" stroke="#387FA0" stroke-opacity=".54"/>
    <text x="989" y="115" font-family="Inter,'Segoe UI',Arial,sans-serif" font-size="12" font-weight="600" fill="#BBDDE9">Retrieval analytics</text>
    <g clip-path="url(#plot)">
      <path d="M990 185L1006 178L1023 182L1042 163L1061 170L1081 151L1105 163L1122 141L1141 150L1164 127L1184 136L1210 114L1210 193H990Z" fill="#28C7D7" fill-opacity=".09"/>
    </g>
    <path d="M990 183L1007 177L1026 181L1048 157L1069 165L1090 144L1111 155L1135 131L1157 143L1184 120L1202 125" fill="none" stroke="#61E9DC" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="1202" cy="125" r="5" fill="#76F3DE"/><circle cx="1202" cy="125" r="12" fill="#76F3DE" opacity=".13" filter="url(#neon)"/>
    <path d="M990 190H1204M990 167H1204M990 144H1204" fill="none" stroke="#4386A1" stroke-opacity=".18" stroke-width=".7"/>
    <!-- Vector retrieval pipeline -->
    <rect x="974" y="219" width="243" height="74" rx="12" fill="url(#tile)" stroke="#387FA0" stroke-opacity=".54"/>
    <text x="989" y="234" font-family="Inter,'Segoe UI',Arial,sans-serif" font-size="9" fill="#91C5D5" letter-spacing="1.4">RETRIEVAL PIPELINE</text>
    <!-- AI chip -->
    <g transform="translate(1000 246)">
      <rect width="34" height="34" rx="7" fill="#0B304D" stroke="#56DDE4" stroke-width="1.2"/>
      <rect x="5" y="5" width="24" height="24" rx="4" fill="#12405D"/>
      <text x="17" y="22" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="12" font-weight="800" fill="#C4FFFF">AI</text>
      <path d="M8 -4V0M17 -4V0M26 -4V0M8 34V38M17 34V38M26 34V38" stroke="#46BDCF" stroke-width="1.5"/>
    </g>
    <path d="M1040 264H1073" stroke="#46CED6" stroke-opacity=".8" stroke-width="1.5" stroke-dasharray="4 4"/>
    <path d="M1068 260L1075 264L1068 268" fill="none" stroke="#46CED6" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- DB -->
    <g transform="translate(1082 249)" stroke="#72E7E4" stroke-width="1.7" fill="none">
      <ellipse cx="15" cy="6" rx="15" ry="6"/><path d="M0 6V26Q15 39 30 26V6M0 16Q15 28 30 16M0 26Q15 38 30 26"/>
    </g>
    <path d="M1121 264H1152" stroke="#46CED6" stroke-opacity=".8" stroke-width="1.5" stroke-dasharray="4 4"/>
    <path d="M1147 260L1154 264L1147 268" fill="none" stroke="#46CED6" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- search -->
    <g transform="translate(1162 246)" stroke="#C4F6FB" fill="none" stroke-width="2.7" stroke-linecap="round">
      <circle cx="13" cy="13" r="10"/><path d="M21 21L34 34"/>
    </g>
  </g>
  <path d="M0 357H1280" stroke="#55D9D8" stroke-opacity=".13"/>
</g>
</svg>
