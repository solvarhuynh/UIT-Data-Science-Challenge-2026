# Shared RAG defaults. Environment-specific files override these values.
chunk_size: 512
chunk_overlap: 80
top_k: 10
similarity_threshold: 0.5

embedding:
  model_path: ./models/bkai-bi-encoder
  device: cpu
  batch_size: 32
  max_length: 256
  normalize_embeddings: true

vector_db:
  type: qdrant
  qdrant_url: http://localhost:6333
  collection_name: legal_chunks
  faiss_index_path: data/vector_store/faiss/legal_chunks

sparse:
  bm25_index_path: data/vector_store/bm25/legal_chunks.pkl

hybrid:
  dense_weight: 0.5
  sparse_weight: 0.5
  candidate_k: 50
  min_score: 0.0
