# Shared RAG defaults. Environment-specific files override these values.
chunk_size: 192
chunk_overlap: 32
top_k: 10
similarity_threshold: 0.5

data:
  processed_root: data/processed

parent_context:
  enabled: true
  parents_dir: data/processed/parents
  max_cached_documents: 128
  max_parent_tokens: 2048
  max_total_tokens: 7000

embedding:
  model_path: ./models/aiteam-vietnamese-embedding-v2
  model_id: AITeamVN/Vietnamese_Embedding_v2
  device: cpu
  batch_size: 32
  max_length: 2048
  query_max_length: 256
  document_max_length: 2048
  output_dimension: 1024
  normalize_embeddings: true
  preprocessor: identity
  window_long_texts: false
  window_overlap_tokens: 32

llm:
  model_path: "./models/qwen3.5-2b"
  backend: "transformers"
  device: "cpu"
  dtype: "float32"
  max_new_tokens: 1024
  temperature: 0.1
  top_p: 0.9
  repetition_penalty: 1.05
  timeout_seconds: 60.0

vector_db:
  type: faiss
  collection_name: legal_chunks_aiteam_vietnamese_embedding_v2_1024
  faiss_index_path: data/vector/faiss

hybrid:
  dense_weight: 0.5
  sparse_weight: 0.5
  candidate_k: 50
  min_score: 0.0
  top_k: 10

reranker:
  enabled: true
  model_name_or_path: "./models/aiteam-vietnamese-reranker"
  device: "cpu"
  batch_size: 16
  max_length: 512
  top_n: 10
