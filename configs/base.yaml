# Shared RAG defaults. Environment-specific files override these values.
chunk_size: 192
chunk_overlap: 32
top_k: 10
similarity_threshold: 0.5

data:
  processed_root: data/processed_v3

parent_context:
  enabled: true
  parents_dir: data/processed_v3/parents
  max_cached_documents: 128
  max_parent_tokens: 2048
  max_total_tokens: 7000

embedding:
  model_path: ./models/dek21-v2
  model_id: huyydangg/DEk21_hcmute_embedding_v2
  device: cpu
  batch_size: 32
  max_length: 256
  output_dimension: 768
  normalize_embeddings: true
  window_long_texts: true
  window_overlap_tokens: 32

llm:
  model_path: "./models/qwen3-legal"
  backend: "transformers"
  device: "cpu"
  dtype: "float32"
  max_new_tokens: 1024
  temperature: 0.1
  top_p: 0.9
  repetition_penalty: 1.05
  stream: false
  timeout_seconds: 60.0

vector_db:
  type: qdrant
  qdrant_url: http://localhost:6333
  collection_name: legal_chunks
  faiss_index_path: data/vector_store/faiss/legal_chunks

sparse:
  bm25_index_path: data/vector_store/bm25/legal_chunks.pkl

hybrid:
  dense_weight: 0.5
  sparse_weight: 0.5
  candidate_k: 50
  min_score: 0.0
  top_k: 10
  bm25_index_path: data/vector_store/bm25/legal_chunks.pkl

reranker:
  enabled: true
  model_name_or_path: "./models/reranker"
  device: "cpu"
  batch_size: 16
  max_length: 512
  top_n: 10
  local_files_only: true
  use_fp16: false
